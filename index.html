<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ImmoProtect, syndic de copropriété au Maroc : sécurité, espaces verts, piscine, réparations, comptes conformes et application résidents. إيموبروتكت، سانديك الإقامات بالمغرب.">
<title>Découvrir ImmoProtect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Tajawal:wght@400;500;700&display=swap">
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a long bilingual sales page in alternating bands (sand / navy), one column, content max 1120px; dir="rtl" on <html> flips the layout for Arabic */
:root{
  --bg:#f5f1ea; --bg2:#ffffff; --navy:#1e2b4a; --navy2:#16213a; --fg:#1b2238; --muted:#5f6880; --line:#e2dcd2;
  --red:#902c34; --red2:#b23a44; --onnavy:#eef0f6; --onnavy-muted:#aeb6cc; --good:#2e7d4f; --warn:#b4701a;
  --sand:#e9e2d6; --shadow:0 18px 50px rgba(30,43,74,.14);
  --display:"Outfit",system-ui,sans-serif; --body:"Source Sans 3",system-ui,sans-serif; --ar:"Tajawal",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a2a; --bg2:#1b2336; --navy:#101727; --navy2:#0c111d; --fg:#e8eaf1; --muted:#a3abc0; --line:#2a3450;
  --red:#d05a63; --red2:#e06d75; --onnavy:#eef0f6; --onnavy-muted:#aeb6cc; --good:#5cc08a; --warn:#e0a24a;
  --sand:#222c44; --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a2a; --bg2:#1b2336; --navy:#101727; --navy2:#0c111d; --fg:#e8eaf1; --muted:#a3abc0; --line:#2a3450;
  --red:#d05a63; --red2:#e06d75; --onnavy:#eef0f6; --onnavy-muted:#aeb6cc; --good:#5cc08a; --warn:#e0a24a;
  --sand:#222c44; --shadow:0 18px 50px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2.1rem,5.2vw,3.6rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:600}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
a{color:inherit}
[dir="rtl"] body,[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] .btn,[dir="rtl"] .eyebrow,[dir="rtl"] .tab,[dir="rtl"] label,[dir="rtl"] input,[dir="rtl"] select,[dir="rtl"] .step b,[dir="rtl"] .kpi b,[dir="rtl"] .report .rh,[dir="rtl"] .strip strong,[dir="rtl"] .proc .p::before{font-family:var(--ar)}
[dir="rtl"] h1{letter-spacing:0;line-height:1.3}
[dir="rtl"] .eyebrow{letter-spacing:0}
[dir="rtl"] body{font-size:18px}
.sub{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
[dir="rtl"] .sub{font-family:var(--body);direction:ltr}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{padding-block:72px}
.band.navy{background:var(--navy);color:var(--onnavy)}
.band.white{background:var(--bg2)}
.eyebrow{font-family:var(--display);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600}
.navy .eyebrow{color:#e9a2a8}
.lead{font-size:1.2rem;color:var(--muted);max-width:60ch}
.navy .lead{color:var(--onnavy-muted)}
.sechead{display:grid;gap:12px;max-width:720px;margin-bottom:36px}
.sechead .sub{font-size:1.2rem;color:var(--muted)}
.navy .sechead .sub{color:var(--onnavy-muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:var(--onnavy);border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;text-decoration:none;direction:ltr}
.logo b{color:#e26c75}
.nav{display:flex;gap:22px;font-size:.95rem}
.nav a{text-decoration:none;color:var(--onnavy-muted)}
.nav a:hover,.nav a:focus-visible{color:var(--onnavy)}
@media (max-width:860px){.nav{display:none}}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.lang button{font:inherit;font-size:.9rem;padding:6px 12px;border:0;border-radius:999px;background:transparent;color:var(--onnavy-muted);cursor:pointer;font-family:var(--display);font-weight:600}
.lang button.ar{font-family:var(--ar)}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:.98rem;padding:11px 20px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e9a2a8;outline-offset:2px}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{background:var(--red2)}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.wa{background:#25a24a;color:#fff}
.btn.wa:hover{background:#1f8a3e}
.btn svg{width:18px;height:18px;flex:none}
@media (max-width:560px){.top .btn.red{display:none}}

/* hero */
.hero{background:var(--navy);color:var(--onnavy);padding-block:56px 72px}
.hero .wrap{display:grid;gap:40px;grid-template-columns:1.05fr 1fr;align-items:center}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.hero .tag{display:inline-block;font-family:var(--display);font-size:.9rem;padding:6px 14px;border:1px solid rgba(255,255,255,.25);border-radius:999px;color:var(--onnavy-muted);margin-bottom:22px}
[dir="rtl"] .hero .tag{font-family:var(--ar)}
.hero h1 span{color:#e9a2a8}
.hero .sub{font-size:1.4rem;color:var(--onnavy-muted);margin-top:14px}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.player{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:#000;aspect-ratio:16/9;max-width:100%}
.player video{width:100%;height:100%;display:block;object-fit:cover}
.player .play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(to top,rgba(10,15,30,.55),rgba(10,15,30,.05));cursor:pointer;border:0;color:#fff;font-family:var(--display);font-weight:600;font-size:1rem}
.player .play span{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--red);box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .15s;margin:0 auto}
.player .play:hover span{transform:scale(1.06)}
.player .play svg{width:34px;height:34px;margin-inline-start:5px}
.player .play small{display:block;margin-top:14px;text-shadow:0 2px 8px rgba(0,0,0,.6);text-align:center}

/* promise strip */
.strip{background:var(--bg2);border-bottom:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.strip .item{padding-block:26px;padding-inline-end:22px;display:grid;gap:4px;min-width:0}
.strip .item+.item{border-inline-start:1px solid var(--line);padding-inline-start:22px}
.strip strong{font-family:var(--display);font-size:1.1rem}
.strip span{color:var(--muted);font-size:.95rem}
@media (max-width:760px){.strip .wrap{grid-template-columns:1fr}.strip .item+.item{border-inline-start:0;border-top:1px solid var(--line);padding-inline-start:0}}

/* services */
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.services{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.services{grid-template-columns:1fr}}
.svc{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:10px;min-width:0}
.svc .ic{width:44px;height:44px;border-radius:12px;background:var(--sand);display:grid;place-items:center;color:var(--navy)}
:root[data-theme="dark"] .svc .ic{color:var(--onnavy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .svc .ic{color:var(--onnavy)}}
.svc .ic svg{width:24px;height:24px}
.svc h3 .sub{display:block;font-size:1rem;color:var(--muted);font-weight:500;margin-top:2px}
.svc p{color:var(--muted);font-size:.98rem}

/* app demo */
.demo{display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:start}
@media (max-width:900px){.demo{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{font-family:var(--display);font-weight:600;font-size:.95rem;padding:9px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:var(--onnavy-muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.steps{display:grid;gap:8px}
.step{text-align:start;background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;color:var(--onnavy-muted);cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font:inherit}
.step b{display:block;color:var(--onnavy);font-family:var(--display);font-weight:600;font-size:.98rem}
.step span{font-size:.9rem}
.step i{font-style:normal;font-family:var(--display);font-weight:700;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:.85rem}
.step[aria-current="true"]{background:rgba(255,255,255,.08);border-color:#e26c75}
.step[aria-current="true"] i{background:var(--red);color:#fff}
.device{background:#0d1322;border-radius:16px;padding:10px;box-shadow:var(--shadow);min-width:0}
.device .bar{display:flex;gap:6px;padding:4px 6px 10px}
.device .bar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18)}
.device img{display:block;width:100%;border-radius:8px;max-width:100%}
.device .cap{color:var(--onnavy-muted);font-size:.92rem;padding:12px 6px 4px;min-height:52px}
.device .cap b{color:var(--onnavy)}

/* residence preview */
.diag{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
@media (max-width:900px){.diag{grid-template-columns:1fr}}
form{display:grid;gap:16px}
.field{display:grid;gap:6px}
label{font-family:var(--display);font-weight:600;font-size:.92rem}
label small{font-weight:400;color:var(--muted);font-family:var(--body);font-size:.88rem}
input,select{font:inherit;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg2);color:var(--fg);width:100%;min-width:0}
input:focus,select:focus{border-color:var(--navy)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;font-weight:500;font-size:.95rem;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg2);cursor:pointer}
.checks input{width:auto;accent-color:var(--red)}
.report{background:var(--navy);color:var(--onnavy);border-radius:18px;padding:28px;box-shadow:var(--shadow);display:grid;gap:18px;position:sticky;top:76px}
.report .rh{font-family:var(--display);font-size:1.3rem;font-weight:600}
.report .rh small{display:block;font-size:.85rem;color:var(--onnavy-muted);font-weight:400;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:rgba(255,255,255,.06);border-radius:12px;padding:14px 12px;display:grid;gap:4px;min-width:0}
.kpi b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--onnavy-muted);line-height:1.25}
.kpi.good b{color:#8fe0b2}
.report ul{margin:0;padding-inline-start:18px;color:var(--onnavy-muted);display:grid;gap:6px;font-size:.98rem}
.report ul b{color:var(--onnavy)}
.report .note{font-size:.8rem;color:var(--onnavy-muted);border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.report .acts{display:flex;flex-wrap:wrap;gap:10px}
.toast{font-size:.85rem;color:#8fe0b2;min-height:1.2em}

/* process */
.proc{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:760px){.proc{grid-template-columns:1fr}}
.proc .p{padding:24px;border-top:3px solid var(--red);background:var(--bg2);display:grid;gap:10px;min-width:0}
.proc .p::before{content:attr(data-step);font-family:var(--display);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:600}
[dir="rtl"] .proc .p::before{letter-spacing:0}
.proc p{color:var(--muted);font-size:.98rem}

/* compliance */
.law{display:grid;grid-template-columns:1.2fr 1fr;gap:34px;align-items:center}
@media (max-width:900px){.law{grid-template-columns:1fr}}
.law ul{margin:0;padding-inline-start:20px;display:grid;gap:8px;color:var(--muted)}
.law .doc{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px;font-size:.95rem}
.law .doc .l{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.law .doc .l span{color:var(--muted)}
.law .doc .l b{font-variant-numeric:tabular-nums}

/* contact */
.contact .wrap{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
@media (max-width:900px){.contact .wrap{grid-template-columns:1fr}}
.ctabox{background:var(--bg2);color:var(--fg);border-radius:18px;padding:28px;display:grid;gap:14px;box-shadow:var(--shadow)}
.ctabox .line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ctabox .line span{color:var(--muted);font-size:.9rem}
.ctabox .line b{direction:ltr;unicode-bidi:isolate}
.ctabox .line button{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
footer{padding-block:28px;font-size:.9rem;color:var(--muted);border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

/* presentation mode */
.pres{position:fixed;inset:0;z-index:20;background:var(--navy);color:var(--onnavy);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.pres[hidden]{display:none}
.pres .pbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid rgba(255,255,255,.1)}
.pres .pbar .logo{font-size:1.2rem}
.pres .prog{position:absolute;top:0;left:0;height:3px;background:var(--red);transition:width .4s;z-index:2}
.pres .pcount{font-family:var(--display);font-size:.85rem;color:var(--onnavy-muted);font-variant-numeric:tabular-nums}
.pres .pclose{font:inherit;font-family:var(--display);font-weight:600;font-size:.9rem;padding:7px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:var(--onnavy);cursor:pointer}
.stage{position:relative;perspective:1600px;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.slide{position:absolute;inset:0;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));overflow:auto;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .7s;opacity:0;pointer-events:none;transform:translateX(60%) rotateY(-28deg) scale(.92)}
[dir="rtl"] .slide{transform:translateX(-60%) rotateY(28deg) scale(.92)}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.out{opacity:0;transform:translateX(-60%) rotateY(28deg) scale(.92)}
[dir="rtl"] .slide.out{transform:translateX(60%) rotateY(-28deg) scale(.92)}
.slide .in{width:min(1120px,100%);display:grid;gap:22px;align-content:center;min-height:0}
.slide h1{font-size:clamp(2rem,4.6vw,3.4rem)}
.slide h2{font-size:clamp(1.6rem,3.6vw,2.6rem)}
.slide .lead{color:var(--onnavy-muted)}
.slide .player{width:min(1000px,100%);margin:0 auto}
.slide .strip3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.slide .strip3 div{background:rgba(255,255,255,.06);border-radius:14px;padding:20px;display:grid;gap:6px;min-width:0}
.slide .strip3 strong{font-family:var(--display);font-size:1.15rem}
.slide .strip3 span{color:var(--onnavy-muted);font-size:.95rem}
.slide .services .svc{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.slide .services .svc p,.slide .services .svc h3 .sub{color:var(--onnavy-muted)}
.slide .services .svc .ic{background:rgba(255,255,255,.1);color:var(--onnavy)}
.slide .appv{display:grid;grid-template-columns:1fr 1.5fr;gap:28px;align-items:center}
.slide .appv .device{transform:rotateY(0deg);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.slide:not(.on) .appv .device{transform:rotateY(-35deg)}
.slide .appv .steps{margin-top:12px}
.slide .diag .report{position:static}
.slide .diag label,.slide .diag label small{color:var(--onnavy)}
.slide .diag input,.slide .diag select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--onnavy)}
.slide .diag .checks label{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
.slide .diag .report{background:rgba(255,255,255,.06)}
.slide .proc .p{background:rgba(255,255,255,.06)}
.slide .proc h3{color:var(--onnavy)}
.slide .proc p{color:var(--onnavy-muted)}
.slide .law ul{color:var(--onnavy-muted)}
.slide .law .doc{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.slide .law .doc .l span{color:var(--onnavy-muted)}
.slide .ctabox{background:rgba(255,255,255,.06);color:var(--onnavy)}
.slide .ctabox .line{border-color:rgba(255,255,255,.12)}
.slide .ctabox .line span{color:var(--onnavy-muted)}
.slide .ctabox .line button{color:var(--onnavy);border-color:rgba(255,255,255,.3)}
.slide .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
@media (max-width:900px){.slide .appv,.slide .two{grid-template-columns:1fr}.slide .strip3{grid-template-columns:1fr}}
.pres .pnav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid rgba(255,255,255,.1)}
.pres .pnav .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pres .pnav .dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.25);cursor:pointer;padding:0}
.pres .pnav .dots button[aria-current="true"]{background:var(--red);transform:scale(1.3)}
.pres .pnav .arr{font:inherit;font-family:var(--display);font-weight:600;padding:9px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:var(--onnavy);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.pres .pnav .arr.next{background:var(--red);border-color:var(--red);color:#fff}
.pres .pnav .arr:disabled{opacity:.35;cursor:default}
.pres .pnav .arr svg{width:16px;height:16px}
[dir="rtl"] .pres .pnav .arr svg{transform:scaleX(-1)}
.top .btn.pres-btn{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:var(--onnavy);padding:9px 16px}
@media (max-width:860px){.top .btn.pres-btn span{display:none}.top .btn.pres-btn{padding:9px 11px}}
@media (prefers-reduced-motion:reduce){.slide,.slide .appv .device{transition:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">

let lang = 'fr';
try { const saved = localStorage.getItem('ip_lang'); if (saved === 'ar' || saved === 'fr') lang = saved; } catch(e){}
const $ = id => document.getElementById(id);
function t(k){ return T[lang][k]; }

function applyLang(){
  const root = document.documentElement;
  root.setAttribute('lang', lang); root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('.proc .p').forEach((p,i) => p.setAttribute('data-step', t('step') + ' ' + (i+1)));
  $('lang-fr').setAttribute('aria-pressed', lang === 'fr'); $('lang-ar').setAttribute('aria-pressed', lang === 'ar');
  $('playbtn').setAttribute('aria-label', t('play'));
  $('wa2').href = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(t('wa_hello'));
  try { localStorage.setItem('ip_lang', lang); } catch(e){}
  renderSteps(); show(); diag();
  if (pSlides.length){
    pSlides.filter(d=>d.dataset.space).forEach(renderAppSlide);
    $('plang-fr').setAttribute('aria-pressed', lang==='fr'); $('plang-ar').setAttribute('aria-pressed', lang==='ar');
    const pw = $('pwa2'); if (pw) pw.href = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(t('wa_hello'));
    if (pOpen) { $('pcount').textContent = (pIdx+1) + ' / ' + pSlides.length; }
  }
}
$('lang-fr').addEventListener('click', ()=>{ lang='fr'; applyLang(); });
$('lang-ar').addEventListener('click', ()=>{ lang='ar'; applyLang(); });

// ---- app walkthrough ----
const stepsEl = $('steps'), shot = $('shot'), cap = $('cap');
let space = 'admin', idx = 0;
function renderSteps(){
  stepsEl.innerHTML = '';
  T[lang].flows[space].forEach((s,i)=>{
    const b = document.createElement('button'); b.className='step'; b.type='button';
    b.setAttribute('aria-current', i===idx ? 'true' : 'false');
    const first = s.c.replace(/<[^>]+>/g,'').split('.')[0];
    b.innerHTML = `<i>${i+1}</i><div><b>${s.t}</b><span>${first}.</span></div>`;
    b.addEventListener('click', ()=>{ idx=i; show(); });
    stepsEl.appendChild(b);
  });
}
function show(){
  const s = T[lang].flows[space][idx];
  shot.src = s.img; shot.alt = s.t + ' — ImmoProtect'; cap.innerHTML = s.c;
  [...stepsEl.children].forEach((b,i)=> b.setAttribute('aria-current', i===idx ? 'true':'false'));
}
document.querySelectorAll('.tab').forEach(tb=> tb.addEventListener('click', ()=>{
  document.querySelectorAll('.tab').forEach(x=> x.setAttribute('aria-selected','false'));
  tb.setAttribute('aria-selected','true'); space = tb.dataset.space; idx = 0; renderSteps(); show();
}));

function diag(){
  const L = T[lang];

  if (has('eq_pool')) team.push(L.team.pool);
  team.push(lots >= 100 ? L.team.clean2 : L.team.clean);

  const services = [...L.svcs.base];
  if (has('eq_lift')) services.push(L.svcs.lift);
  if (has('eq_park')) services.push(L.svcs.park);
  if (has('eq_gym')) services.push(L.svcs.gym);
  if (has('eq_gate')) services.push(L.svcs.gate);
  if (has('eq_garden')) services.push(L.svcs.garden);
  if (has('eq_pool')) services.push(L.svcs.pool);
  const start = L.start[now];
  $('k_team').textContent = String(team.length); $('k_services').textContent = String(services.length); $('k_delay').textContent = start;
  const sep = lang==='ar' ? '، ' : ', ';
  const items = [];
  items.push(`<b>${L.r_team}</b> ${L.r_for.replace('{n}', lots)} : ${team.join(sep)}.`);
  items.push(`<b>${L.r_services}</b> : ${services.join(sep)}.`);

  items.push(`<b>${L.r_next}</b> : ${L.next[now]}.`);
  $('rlist').innerHTML = items.map(i=>`<li>${i}</li>`).join('');
  const lbl = id => $(id).parentElement.querySelector('span').textContent.trim();
  summary = `${L.sum_title} — ${name}${city ? ' (' + city + ')' : ''}\n` +
    `• ${lots} ${L.sum_lots} : ${$('now').options[$('now').selectedIndex].text}\n` +
    `• ${L.sum_eq} : ${['eq_gate','eq_garden','eq_pool','eq_lift','eq_park','eq_gym'].filter(has).map(lbl).join(sep) || L.sum_none}\n` +
    `• ${L.sum_w} : ${['w_sec','w_clean','w_money','w_fast'].filter(has).map(lbl).join(sep) || L.sum_none}\n` +
    L.sum_end;
  $('wa').href = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(summary);
}
$('dform').addEventListener('input', diag);
$('dform').addEventListener('submit', e=>{ e.preventDefault(); diag(); });

function copyText(text, msgEl){
  const done = ()=>{ if (msgEl) { msgEl.textContent = t('copied'); setTimeout(()=> msgEl.textContent='', 2000); } };
  try { navigator.clipboard.writeText(text).then(done).catch(()=>fallback()); } catch(e){ fallback(); }
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){} ta.remove(); }
}
$('copy').addEventListener('click', ()=> copyText(summary, $('toast')));
document.querySelectorAll('[data-copy]').forEach(b=> b.addEventListener('click', ()=>{ copyText($(b.dataset.copy).textContent); b.textContent=t('copied2'); setTimeout(()=>b.textContent=t('copy'),2000); }));

// ---- presentation mode ----
const pres = $('pres'), stage = $('stage'), pdots = $('pdots');
let pOpen = false, pIdx = 0, pSlides = [], resHome = null, resPlaceholder = null;
function buildSlides(){
  stage.innerHTML = ''; pSlides = [];
  const mk = html => { const d = document.createElement('div'); d.className = 'slide'; d.innerHTML = `<div class="in">${html}</div>`; stage.appendChild(d); pSlides.push(d); return d; };
  // 1 film
  const s1 = mk(`<div class="player"><video id="pfilm" poster="hero.jpg" preload="metadata" playsinline controls src="small.mp4"></video></div>`);
  // 2 promise
  mk(`<span class="tag" data-i18n="hero_tag"></span><h1 data-i18n="hero_h1"></h1><p class="lead" data-i18n="hero_lead"></p><div class="strip3"><div><strong data-i18n="s1t"></strong><span data-i18n="s1d"></span></div><div><strong data-i18n="s2t"></strong><span data-i18n="s2d"></span></div><div><strong data-i18n="s3t"></strong><span data-i18n="s3d"></span></div></div>`);
  // 3 services
  const svcHtml = document.querySelector('#services .services').outerHTML;
  mk(`<span class="eyebrow" data-i18n="svc_eyebrow"></span><h2 data-i18n="svc_h2"></h2>${svcHtml}`);
  // 4-6 app views
  ['admin','resident','tech'].forEach(sp => {
    const d = mk(`<span class="eyebrow" data-i18n="app_eyebrow"></span><div class="appv"><div><h2 data-i18n="tab_${sp==='resident'?'res':sp}"></h2><p class="lead" data-i18n="app_lead"></p><div class="steps"></div></div><div class="device"><div class="bar"><i></i><i></i><i></i></div><img alt="ImmoProtect"><div class="cap"></div></div></div>`);
    d.dataset.space = sp; d.dataset.idx = '0';
  });
  // 7 residence (live form moved in)
  const s7 = mk(`<span class="eyebrow" data-i18n="res_eyebrow"></span><h2 data-i18n="res_h2"></h2><div class="reshost"></div>`);
  // 8 method + transparency
  const procHtml = document.querySelector('#methode .proc').outerHTML;
  mk(`<span class="eyebrow" data-i18n="m_eyebrow"></span><h2 data-i18n="m_h2"></h2>${procHtml}<div class="two" style="margin-top:8px"><div><h3 data-i18n="c_h2" style="margin-bottom:8px"></h3><ul class="law-ul" style="color:var(--onnavy-muted);padding-inline-start:18px;margin:0;display:grid;gap:6px"><li data-i18n="c1"></li><li data-i18n="c2"></li><li data-i18n="c3"></li><li data-i18n="c4"></li></ul></div></div>`);
  // 9 contact
  const ctaHtml = document.querySelector('#contact .ctabox').outerHTML.replace(/id="wa2"/,'id="pwa2"').replace(/id="phone"/,'id="pphone"').replace(/id="mail"/,'id="pmail"').replace(/data-copy="phone"/,'data-copy="pphone"').replace(/data-copy="mail"/,'data-copy="pmail"');
  mk(`<div class="two"><div><span class="eyebrow" data-i18n="ct_eyebrow"></span><h2 data-i18n="pres_end" style="margin-top:12px"></h2><p class="lead" style="margin-top:12px" data-i18n="ct_lead"></p><p class="sub" style="font-size:1.2rem;color:var(--onnavy-muted);margin-top:12px" data-i18n="ct_sub"></p></div>${ctaHtml}</div>`);
  // dots
  pdots.innerHTML = ''; pSlides.forEach((_,i)=>{ const b=document.createElement('button'); b.type='button'; b.setAttribute('aria-label', String(i+1)); b.addEventListener('click', ()=>goTo(i)); pdots.appendChild(b); });
  // app slides behaviour
  pSlides.filter(d=>d.dataset.space).forEach(d => renderAppSlide(d));
  // contact copy buttons in slide
  pSlides[8].querySelectorAll('[data-copy]').forEach(b=> b.addEventListener('click', ()=>{ copyText($(b.dataset.copy).textContent); b.textContent=t('copied2'); setTimeout(()=>b.textContent=t('copy'),2000); }));
}
function renderAppSlide(d){
  const sp = d.dataset.space, flow = T[lang].flows[sp], i = +d.dataset.idx;
  const st = d.querySelector('.steps'); st.innerHTML = '';
  flow.forEach((s,k)=>{ const b=document.createElement('button'); b.className='step'; b.type='button'; b.setAttribute('aria-current', k===i?'true':'false');
    b.innerHTML = `<i>${k+1}</i><div><b>${s.t}</b><span>${s.c.replace(/<[^>]+>/g,'').split('.')[0]}.</span></div>`;
    b.addEventListener('click', ()=>{ d.dataset.idx = String(k); renderAppSlide(d); }); st.appendChild(b); });
  d.querySelector('img').src = flow[i].img; d.querySelector('.cap').innerHTML = flow[i].c;
}
function goTo(i){
  i = Math.max(0, Math.min(pSlides.length-1, i));
  pSlides.forEach((d,k)=>{ d.classList.toggle('on', k===i); d.classList.toggle('out', k<i); });
  pIdx = i;
  $('pcount').textContent = (i+1) + ' / ' + pSlides.length;
  $('pprog').style.width = ((i+1)/pSlides.length*100) + '%';
  [...pdots.children].forEach((b,k)=> b.setAttribute('aria-current', k===i?'true':'false'));
  $('pprev').disabled = i===0; $('pnext').disabled = i===pSlides.length-1;
  const pf = $('pfilm'); if (pf && i!==0) pf.pause();
}
function openPres(){
  if (!pSlides.length) buildSlides();
  // move the live residence block into slide 7
  const diag = document.querySelector('#residence .diag');
  if (diag && !resHome){ resHome = diag.parentElement; resPlaceholder = document.createComment('diag'); resHome.replaceChild(resPlaceholder, diag); pSlides[6].querySelector('.reshost').appendChild(diag); }
  pres.hidden = false; pOpen = true; document.body.style.overflow = 'hidden';
  applyLang(); goTo(0); $('pnext').focus();
}
function closePres(){
  const diag = pSlides.length && pSlides[6].querySelector('.diag');
  if (diag && resHome){ resHome.replaceChild(diag, resPlaceholder); resHome = null; }
  const pf = $('pfilm'); if (pf) pf.pause();
  pres.hidden = true; pOpen = false; document.body.style.overflow = '';
  if (location.hash === '#presentation') history.replaceState(null, '', location.pathname);
}
$('pres-open').addEventListener('click', openPres);
$('pres-close').addEventListener('click', closePres);
$('plogo').addEventListener('click', e=>{ e.preventDefault(); closePres(); });
$('pprev').addEventListener('click', ()=>goTo(pIdx-1));
$('pnext').addEventListener('click', ()=>goTo(pIdx+1));
$('plang-fr').addEventListener('click', ()=>{ lang='fr'; applyLang(); });
$('plang-ar').addEventListener('click', ()=>{ lang='ar'; applyLang(); });
document.addEventListener('keydown', e=>{
  if (!pOpen) return;
  const rtl = lang==='ar';
  if (e.key==='Escape') closePres();
  else if (e.key==='ArrowRight' || e.key==='PageDown' || e.key===' ') { if (e.target.tagName!=='INPUT') { e.preventDefault(); goTo(pIdx + (rtl && e.key==='ArrowRight' ? -1 : 1)); } }
  else if (e.key==='ArrowLeft' || e.key==='PageUp') { e.preventDefault(); goTo(pIdx - (rtl && e.key==='ArrowLeft' ? -1 : 1)); }
});
let tx = null;
stage.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e=>{ if (tx===null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) < 50) return; const dir = dx < 0 ? 1 : -1; goTo(pIdx + (lang==='ar' ? -dir : dir)); }, {passive:true});

applyLang();
if (location.hash === '#presentation') openPres();
</script>

</body>
</html>
